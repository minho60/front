<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Scroll Page</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
        }

        /* 
           스크롤 트랙: 전체 스크롤 길이를 결정합니다.
           페이지 수 * 100vh 정도로 설정하면 적당한 속도가 나옵니다.
        */
        .scroll-track {
            height: 500vh;
        }

        /*
           Sticky Wrapper: 뷰포트에 고정되어 가로로 움직일 영역을 보여줍니다.
        */
        .sticky-wrapper {
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /*
           가로 스트립: 실제 페이지들이 가로로 나열된 컨테이너
        */
        .horizontal-strip {
            display: flex;
            width: max-content;
            /* 내용물만큼 너비 가짐 */
            height: 100%;
            will-change: transform;
            /* 성능 최적화 */
        }

        .page {
            width: 100vw;
            height: 100vh;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            color: #fff;
            font-weight: bold;
            box-sizing: border-box;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .page1 {
            background: #ff6b6b;
        }

        .page2 {
            background: #4d96ff;
        }

        .page3 {
            background: #6bcf63;
        }

        .page4 {
            background: #ffc93c;
        }

        .page5 {
            background: #a55eea;
        }

        /* 안내 문구 */
        .scroll-guide {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>

<body>

    <div class="scroll-track">
        <div class="sticky-wrapper">
            <div class="horizontal-strip">
                <section class="page page1">Page 1</section>
                <section class="page page2">Page 2</section>
                <section class="page page3">Page 3</section>
                <section class="page page4">Page 4</section>
                <section class="page page5">Page 5</section>
            </div>
        </div>
    </div>

    <div class="scroll-guide">
        Scroll Down ↓
    </div>

    <script>
        const scrollTrack = document.querySelector('.scroll-track');
        const stickyWrapper = document.querySelector('.sticky-wrapper');
        const horizontalStrip = document.querySelector('.horizontal-strip');

        window.addEventListener('scroll', () => {
            // stickyWrapper가 상단에 고정된 상태에서, track의 남은 거리를 계산
            const offsetTop = stickyWrapper.parentElement.offsetTop;

            // 전체 스크롤 가능한 거리 (트랙 높이 - 뷰포트 높이)
            const scrollDist = scrollTrack.offsetHeight - window.innerHeight;

            // 현재 스크롤 위치
            const scrollTop = window.scrollY;

            // 진행률 (0 ~ 1)
            let progress = scrollTop / scrollDist;

            // 범위 제한 (Sticky 영역 밖에서의 오작동 방지)
            progress = Math.min(Math.max(progress, 0), 1);

            // 가로 이동 거리 계산: (전체 가로 너비 - 뷰포트 너비) * 진행률
            const maxScrollLeft = horizontalStrip.scrollWidth - window.innerWidth;
            const translateX = maxScrollLeft * progress;

            horizontalStrip.style.transform = `translateX(-${translateX}px)`;
        });
    </script>
</body>

</html>
