<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메가박스</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.js"></script>
    <style>
        body{
            margin: 0;
        }
        /* .bxslider의 부모 div */
        .bx-wrapper{
            background: none;
            border: none;
            box-shadow: none;
        }
        /* 좌우 버튼 공통 */
        .bx-wrapper .bx-controls-direction a {
            width: 18px;
            height: 30px;
         }
         /* prev 버튼 */
         .bx-wrapper .bx-prev {
            background: url("assets/btn_slide_prev_new.png") no-repeat center/contain !important;
            left: calc(50% - 620px)

         }
         /* next 버튼 */
         .bx-wrapper .bx-next{
            background: url("assets/btn_slide_next_new.png") no-repeat center/contain !important;
            right: calc(50% - 620px)
         }

    </style>
</head>

<body>
    <div class="bxslider">
        <div><img src="assets/bg-main-boutiq.png" alt="boutiq" /></div>
        <div><img src="assets/bg-main-comfort.png" alt="comfort" /></div>
        <div><img src="assets/bg-main-dolbyatmos.png" alt="dolbyatmos" /></div>
        <div><img src="assets/bg-main-dolbycinema.png" alt="dolbycinema" /></div>
        <div><img src="assets/bg-main-dva.png" alt="dv" /></div>
        <div><img src="assets/bg-main-led.png" alt="led" /></div>
        <!-- <div><img src="assets/bg-main-movie-rank.png" alt="-movie-rank" /></div> -->
        <div><img src="assets/bg-main-mx4d.png" alt="mx4d" /></div>
        <div><img src="assets/bg-main-private.png" alt="private" /></div>
        <div><img src="assets/bg-main-recliner.png" alt="recliner" /></div>
        <div><img src="assets/bg-main-suite.png" alt="suite" /></div>

    </div>
    <script>
        $('.bxslider').bxSlider({
            auto: true, // 자동 슬라이드
            pager:false, // 인디케이터
            stopAutoOnClick: true, // 버튼 클릭시 자동 슬라이드 정지
            autoHover: true, // 이미지에 호버시 자동 슬라이드 일시정지
            slideWidth:170, // 슬라이드 아이템 하나의 가로 크기
           
            minSlides:6, // 기본값 1, 반응형
            maxSlides:6, //  기본값 1, 반응형
            moveSlides:1, // 기본값 0, 아이템 이동 개수
            slideMargin:16 // 아이템 사이 여백

        });
    </script>
</body>

</html>
