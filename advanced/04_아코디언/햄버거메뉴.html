<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>햄버거메뉴</title>
    <style>
        body {
            background-color: #333;
            width: 500px;
            margin: 30px auto;
        }

        .menu-trigger {
            margin-right: 70px;
            margin-bottom: 50px;
        }

        .menu-trigger,
        .menu-trigger span {
            display: inline-block;
            transition: all .4s;
            box-sizing: border-box;
        }

        .menu-trigger {
            position: relative;
            width: 50px;
            height: 44px;
        }

        .menu-trigger span {
            position: absolute;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #fff;
            border-radius: 4px;
        }

        .menu-trigger span:nth-of-type(1) {top: 0;}
        .menu-trigger span:nth-of-type(2) {top: 20px;}
        .menu-trigger span:nth-of-type(3) {bottom: 0;}

        /* 라인이 하나로 합쳐졌다가 엑스자 만들기 */
        .menu-trigger span:nth-of-type(1) {
            animation: menu-bar07-01 .75s forwards;
        }

        @keyframes menu-bar07-01 {
            0% {transform: translateY(20px) rotate(45deg);}
            50% {transform: translateY(20px) rotate(0);}
            100% {transform: translateY(0) rotate(0);}
        }

        .menu-trigger span:nth-of-type(2) {
            transition: all .25s .25s;
            opacity: 1;
        }

        .menu-trigger span:nth-of-type(3) {
            -webkit-animation: menu-bar07-02 .75s forwards;
            animation: menu-bar07-02 .75s forwards;
        }

        @keyframes menu-bar07-02 {
            0% {transform: translateY(-20px) rotate(-45deg);}
            50% {transform: translateY(-20px) rotate(0);}
            100% {transform: translateY(0) rotate(0);}
        }

        .menu-trigger.active span:nth-of-type(1) {
            -webkit-animation: active-menu-bar07-01 .75s forwards;
            animation: active-menu-bar07-01 .75s forwards;
        }

        @keyframes active-menu-bar07-01 {
            0% {transform: translateY(0) rotate(0);}
            50% {transform: translateY(20px) rotate(0);}
            100% {transform: translateY(20px) rotate(45deg);}
        }

        .menu-trigger.active span:nth-of-type(2) {
            opacity: 0;
        }

        .menu-trigger.active span:nth-of-type(3) {
            animation: active-menu-bar07-02 .75s forwards;
        }

        @keyframes active-menu-bar07-02 {
            0% {transform: translateY(0) rotate(0);}
            50% {transform: translateY(-20px) rotate(0);}
            100% {transform: translateY(-20px) rotate(-45deg);}
        }
    </style>
</head>

<body>
    <a class="menu-trigger" href="#">
        <span></span>
        <span></span>
        <span></span>
    </a>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const burger = document.querySelector('.menu-trigger');

            burger.addEventListener('click', function (e) {
                e.preventDefault();
                this.classList.toggle('active');
            });
        });
    </script>
</body>

</html>
